name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/check-copy.mjs
      - run: node scripts/check-no-competitors.mjs
        env:
          BANNED_NAMES: ${{ secrets.BANNED_NAMES }}
      - run: npx tsc --noEmit
      - run: npx vitest run
