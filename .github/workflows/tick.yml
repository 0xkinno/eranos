name: keeper tick
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Call the keeper tick
        env:
          ERANOS_URL: ${{ secrets.ERANOS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$ERANOS_URL" && test -n "$CRON_SECRET" || { echo "secrets ERANOS_URL and CRON_SECRET are not set"; exit 1; }
          code=$(curl -sS -m 280 -o out.json -w "%{http_code}" -X POST "$ERANOS_URL/api/cron/tick" -H "authorization: Bearer $CRON_SECRET" -H "x-github-run-id: $GITHUB_RUN_ID")
          cat out.json; echo; test "$code" = "200"
